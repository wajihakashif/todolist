
<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: rgb(160, 107, 173);
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            padding: 20px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 60%;
            
        }

        button {
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            background-color: lightgray;
            padding: 10px;
            margin: 10px;
            display: flex;
            justify-content: space-between;
        }

        .delete {
            background-color: rgb(109, 6, 6);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <input type="text" id="taskInput"
        placeholder="Enter your task">

        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>

    </div>

    <script>

        function addTask() {

            let task = document.getElementById("taskInput").value;

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            li.innerHTML = task +
            '<button class="delete" onclick="this.parentElement.remove()">Delete</button>';

            document.getElementById("taskList").appendChild(li);

            document.getElementById("taskInput").value = "";

        }

    </script>

</body>
</html>
